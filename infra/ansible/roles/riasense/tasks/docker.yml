# Docker Engine e o plugin compose a partir do repositório oficial (Debian e Ubuntu).
- name: Pacotes base
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, qemu-guest-agent]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: O qemu-guest-agent a correr (o Proxmox passa a ver o IP)
  ansible.builtin.service:
    name: qemu-guest-agent
    state: started
    enabled: true
  failed_when: false  # fora do Proxmox não há o dispositivo do agente

- name: Pasta das chaves do apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Chave do repositório do Docker
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Repositório do Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Docker Engine e plugin compose
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present
    update_cache: true

- name: Docker a correr no arranque
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
