<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RiaSense: vigiar, completar, prever e proteger sobre o Living Lab de Aveiro." />
    <title>RiaSense</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Tema antes do primeiro desenho, para não piscar: a escolha guardada ou a do sistema.
      try {
        var t = localStorage.getItem("riasense.tema");
        var claro = t ? t === "claro" : matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.dataset.theme = claro ? "light" : "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
