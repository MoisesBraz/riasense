# Web da RiaSense: ficheiros estáticos, incluindo o mapa offline (ADR-0014).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # O worker do MapLibre é um módulo ES (.mjs): o browser só o aceita com um tipo JavaScript.
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
    }

    # A API na mesma origem (ADR-0028): o browser chama /api/... e o nginx passa ao serviço `api` do compose.
    # Assim a demo abre-se de qualquer máquina sem recompilar a web com o endereço da API.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # O Swagger da API (/api/docs) pede o esquema na raiz: sem isto, a página de documentação fica vazia.
    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
    }

    # O MapLibre lê o .pmtiles aos bocados (pedidos Range), que o nginx serve por omissão.
    # Sem gzip aqui: os tiles já vêm comprimidos dentro do ficheiro.
    location /tiles/ {
        types { }
        default_type application/octet-stream;
    }
}
